<style>

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}

.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:1rem}

details{border-bottom:2px solid #38bdf8;padding:.7rem 0}summary{cursor:pointer;font-size:1.15rem;list-style:none}summary b{font-size:.9rem}

textarea{min-height:11rem;border:0;resize:vertical;display:block}
code.i{font-family:"JetBrains Mono",monospace;font-size:.9em;background:var(--ln);padding:.1em .35em;border-radius:5px}

.fb{padding:.7rem 1rem;border-radius:10px;margin-top:.8rem;background:var(--ln)}
.t{padding:.4rem .7rem;border-radius:8px;margin:.3rem 0;font:.85rem "JetBrains Mono",monospace}.t.ok{background:var(--okb);color:var(--ok)}.t.bad{background:var(--badb);color:var(--bad)}

label{display:block;font-weight:700;margin:1rem 0 .3rem}

.rd{min-height:100vh;background:var(--rb);color:var(--rf)}

.rt{display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;background:var(--sf);color:var(--ink);flex-wrap:wrap;position:sticky;top:0}
.rt .tag{margin:0}.rt button{padding:.3rem .8rem;min-height:40px}.rt .sp{margin-left:auto;display:flex;gap:.4rem}
.rc{max-width:42rem;margin:0 auto;padding:3rem 1.2rem 5rem;line-height:1.9}.rc h2{text-align:center;font-size:1.8em}
.rd .row button.al{color:var(--rf);border-color:var(--rf)}.rd .row button:not(.al){background:var(--hl);color:#14213d;border-color:var(--hl)}
.rd code.i{background:#ffffff26}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{border:0;padding:.2rem .5rem;margin:0}.who{margin:0;border:0;padding:0}main{padding:1rem}.g2,.fi,.lg{grid-template-columns:1fr}.lg .l{padding:2rem}}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.st{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:.5rem .9rem}.st b{font-size:1.2rem}
.rk{display:flex;align-items:center;gap:.8rem;padding:.6rem .8rem;border-bottom:1px solid var(--ln)}.rk.me{background:var(--hl);color:#14213d;border-radius:8px;font-weight:700}.rk .n{width:1.6rem;text-align:right;font-weight:700}.rk .x{margin-left:auto}
.lgb{padding:.05rem .6rem;border-radius:99px;color:#fff;font-weight:700;font-size:.8rem}.sh{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--ln)}.sh button{margin-left:auto}
.who small{font-weight:400;color:#9aa6c4}.toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#ffd60a;color:#14213d;font-weight:700;padding:.6rem 1.1rem;border-radius:99px;z-index:50;box-shadow:0 4px 14px #0004}
</style>

var BK=[{id:"kds",n:1,t:"Análisis y diseño de sistemas",au:"Lecciones basadas en el libro de Kenneth E. Kendall",tema:"FUNDAMENTOS",tags:"sistemas, roles, SDLC, metodologías",d:"Antes de programar hay que entender qué se construye y para quién. Recorre el libro en bloques de unas 25 páginas: lectura corta, quiz y un reto de código. Cada paso te da XP y monedas.",c:["#2563eb","#14213d"],ch:[
{t:"Sistemas, roles y metodologías",pg:"págs. 1–23",res:"Qué tipos de sistemas existen, qué hace un analista y cómo se organiza el desarrollo de un sistema.",
pages:[
{t:"La pirámide de sistemas",h:`<p>Cada nivel de una organización usa un tipo de sistema. De abajo hacia arriba:</p><ul><li><b>TPS</b>: procesan transacciones rutinarias, como nóminas o inventario.</li><li><b>OAS y KWS</b>: apoyan el trabajo con conocimiento, desde hojas de cálculo hasta ingenieros o médicos que crean saber nuevo.</li><li><b>MIS y DSS</b>: convierten datos en información para decidir. El DSS ayuda, pero decide la persona.</li><li><b>Sistema experto</b>: guarda la experiencia de especialistas y propone la mejor solución a un problema concreto.</li><li><b>GDSS y CSCWS</b>: ayudan a grupos a decidir y colaborar.</li><li><b>ESS</b>: apoyan las decisiones estratégicas de los ejecutivos.</li></ul>`},
{t:"Tecnologías que se mezclan",h:`<p>Las organizaciones llevan la información como un recurso valioso, y tiene costos: producirla, guardarla, protegerla y recuperarla.</p><p>Con redes, Internet y el comercio electrónico llegan sistemas nuevos. Parte del trabajo del analista es <b>integrarlos</b> con los sistemas tradicionales que la empresa ya usa.</p>`},
{t:"Los tres sombreros del analista",h:`<p>Un analista de sistemas cumple varios roles:</p><ul><li><b>Consultor:</b> ofrece una mirada externa para resolver un problema.</li><li><b>Experto de soporte:</b> aporta apoyo técnico desde dentro de la organización.</li><li><b>Agente de cambio:</b> ayuda a las personas a adoptar el sistema nuevo.</li></ul><p>Casi siempre se combinan los tres.</p>`},
{t:"SDLC: las siete fases",h:`<p>El ciclo de vida del desarrollo de sistemas ordena el trabajo en siete fases:</p><ol><li>Identificar problemas, oportunidades y objetivos.</li><li>Determinar los requerimientos de información.</li><li>Analizar las necesidades del sistema.</li><li>Diseñar el sistema recomendado.</li><li>Desarrollar y documentar el software.</li><li>Probar y mantener el sistema.</li><li>Implementar y evaluar el sistema.</li></ol>`},
{t:"Otras formas de construir",h:`<p>Además del SDLC clásico hay tres ideas que conviene conocer:</p><ul><li><b>Herramientas CASE:</b> software que ayuda al analista a documentar y diseñar.</li><li><b>Metodología ágil:</b> avances cortos, mucho diálogo con el usuario y apertura al cambio.</li><li><b>Orientado a objetos:</b> modela el sistema con clases y objetos.</li></ul><p>No hay un método ganador: se elige según el proyecto y el equipo.</p>`}],
quiz:[
{q:"¿Qué sistema procesa transacciones rutinarias como la nómina?",o:["TPS","DSS","ESS","GDSS"],a:0,e:"El TPS trabaja en el nivel operacional con transacciones del día a día."},
{q:"¿Qué distingue a un sistema experto de un DSS?",o:["El experto no usa datos","El experto propone la mejor solución; el DSS deja decidir a la persona","El DSS es solo para ejecutivos","No hay diferencia"],a:1,e:"El DSS apoya la decisión; el sistema experto selecciona la solución."},
{q:"¿Qué rol da apoyo técnico desde dentro de la organización?",o:["Consultor","Usuario final","Experto de soporte","Auditor"],a:2,e:"El experto de soporte trabaja dentro de la empresa como recurso técnico."},
{q:"¿Cuántas fases tiene el SDLC?",o:["5","6","7","9"],a:2,e:"Son siete, desde identificar el problema hasta implementar y evaluar."},
{q:"¿Qué fase sigue después de analizar las necesidades del sistema?",o:["Diseñar el sistema recomendado","Probar el sistema","Implementar","Identificar problemas"],a:0,e:"El orden es: identificar, requerimientos, análisis y luego diseño."},
{q:"¿Qué enfoque modela el sistema con clases y objetos?",o:["Metodología ágil","Herramientas CASE","SDLC","Orientado a objetos"],a:3,e:"El análisis y diseño orientado a objetos usa clases y objetos."}],
glos:[["Analista de sistemas","Profesional que estudia las necesidades de información de una organización y diseña soluciones."],["TPS","Sistema de procesamiento de transacciones rutinarias."],["MIS","Sistema de información administrativa: apoya tareas y decisiones de gestión con una base de datos común."],["DSS","Sistema de soporte de decisiones: ayuda a decidir, pero decide la persona."],["Sistema experto","Sistema que usa conocimiento de especialistas para resolver un problema concreto."],["ESS","Sistema de soporte para ejecutivos, para decisiones estratégicas."],["SDLC","Ciclo de vida del desarrollo de sistemas, de siete fases."],["CASE","Herramientas de software que asisten al analista en su trabajo."],["Metodología ágil","Desarrollo en pasos cortos, con colaboración y adaptación al cambio."]],

[["Comprensión y modelado de los sistemas organizacionales","24–55"],["Administración de proyectos (1/2)","56–79"],["Administración de proyectos (2/2)","80–102"],["Recopilación de información: métodos interactivos","103–130"],["Recopilación de información: métodos discretos","131–154"],["Modelado ágil y prototipos (1/2)","155–174"],["Modelado ágil y prototipos (2/2)","175–192"],["Diagramas de flujo de datos (1/2)","193–210"],["Diagramas de flujo de datos (2/2)","211–227"],["Diccionarios de datos","228–258"],["Procesos y decisiones estructuradas","259–280"],["Diseño orientado a objetos con UML (1/2)","281–304"],["Diseño orientado a objetos con UML (2/2)","305–328"],["Diseño de una salida efectiva (1/2)","329–349"],["Diseño de una salida efectiva (2/2)","350–370"],["Diseño de una entrada efectiva","371–402"],["Diseño de bases de datos (1/2)","403–421"],["Diseño de bases de datos (2/2)","422–440"],["Interacción humano-computadora (1/2)","441–462"],["Interacción humano-computadora (2/2)","463–484"],["Procedimientos de entrada de datos","485–514"],["Aseguramiento e implementación de la calidad","desde 515"]].forEach(function(x){BK[0].ch.push({t:x[0],pg:"págs. "+x[1],soon:1})});
BK[0].ch[1]={t:"Comprensión y modelado de los sistemas organizacionales",pg:"págs. 24–55",res:"La organización vista como sistema y tres formas de dibujarla: diagramas de flujo de datos, entidad-relación y casos de uso.",
pages:[
{t:"La organización es un sistema",h:`<p>Una organización se puede ver como un sistema formado por subsistemas que se relacionan y dependen unos de otros.</p><p>Todo sistema recibe <b>entradas</b> de su entorno, las transforma con <b>procesos</b> y entrega <b>salidas</b>. La <b>retroalimentación</b> compara las salidas con los objetivos para controlar el sistema.</p><p>El entorno también cuenta: factores económicos, políticos y legales influyen, y la organización rara vez los controla.</p>`},
{t:"Dibujar el flujo de datos",h:`<p>Un diagrama de flujo de datos (DFD) muestra cómo se mueve la información. Usa pocos símbolos:</p><ul><li><b>Proceso:</b> se realiza una o varias acciones.</li><li><b>Entidad:</b> persona, grupo, departamento o sistema que da o recibe datos.</li><li><b>Flujo de datos:</b> la información que un proceso envía o recibe.</li><li><b>Almacén de datos:</b> el lugar donde se guardan los datos.</li></ul>`},
{t:"Entidades y relaciones",h:`<p>El modelo entidad-relación (E-R) describe los datos con tres piezas:</p><ul><li><b>Entidad:</b> algo sobre lo que se guarda información.</li><li><b>Atributo:</b> una característica de la entidad.</li><li><b>Relación:</b> la asociación entre dos entidades.</li></ul><p>Ejemplo: un <i>Analista</i> es asignado a un <i>Proyecto</i>. El libro dibuja las relaciones con la notación de pata de cuervo.</p>`},
{t:"Casos de uso",h:`<p>Un caso de uso cuenta qué hace el sistema para alguien, sin entrar en detalles técnicos. Sus diagramas son simples y ayudan a hablar de requisitos con los usuarios.</p><p>Entre casos de uso hay relaciones de tipo <b>comunica, incluye, extiende y generaliza</b>.</p><p>Se trabaja en tres pasos: definir el alcance, dibujar el diagrama y escribir los <b>escenarios</b>, que son los pasos de cada caso y sus alternativas.</p>`},
{t:"Niveles y cultura",h:`<p>La administración se reparte en tres niveles: <b>control operacional</b>, <b>planeación y control administrativo</b> (nivel medio) y <b>administración estratégica</b>. Cada uno pide información distinta al sistema.</p><p>Además, cada organización tiene su <b>cultura</b>, con subculturas que a veces compiten. Un buen analista la observa antes de proponer cambios.</p>`}],
quiz:[
{q:"¿Para qué sirve la retroalimentación en un sistema?",o:["Para guardar archivos","Para comparar las salidas con los objetivos y controlar el sistema","Para dibujar diagramas","Para eliminar procesos"],a:1,e:"Las salidas se comparan con las metas y así se corrige el rumbo."},
{q:"En un DFD, ¿qué muestra un flujo de datos?",o:["Dónde se guarda la información","Quién es el usuario","Que un proceso envía o recibe información","El costo del proyecto"],a:2,e:"El flujo conecta símbolos e indica el movimiento de información."},
{q:"En un DFD, ¿qué es una entidad?",o:["Una persona, grupo o sistema que da o recibe datos","Una acción que transforma datos","Un diagrama completo","Un error del sistema"],a:0,e:"Las entidades están fuera del proceso y son origen o destino de datos."},
{q:"¿Qué describe una relación en un diagrama E-R?",o:["Una característica de una entidad","La asociación entre entidades","El tamaño de la base de datos","El orden de los pasos"],a:1,e:"Una relación asocia entidades, como Analista y Proyecto."},
{q:"¿Cuál NO es una relación entre casos de uso?",o:["Incluye","Extiende","Generaliza","Compila"],a:3,e:"Las relaciones son comunica, incluye, extiende y generaliza."},
{q:"¿Cuál es el nivel más alto de administración?",o:["Control operacional","Planeación y control administrativo","Administración estratégica","Soporte técnico"],a:2,e:"La administración estratégica define el rumbo de la organización."}],
glos:[["Entrada, proceso, salida","Lo que un sistema recibe, lo que hace con ello y lo que entrega."],["Retroalimentación","Uso de las salidas para controlar el sistema."],["Entorno","Todo lo que rodea al sistema y lo influye."],["DFD","Diagrama de flujo de datos."],["Entidad","Persona, grupo o sistema que da o recibe datos; en E-R, objeto sobre el que se guarda información."],["Atributo","Característica que describe a una entidad."],["Relación","Asociación entre entidades."],["Caso de uso","Descripción de cómo alguien usa el sistema para lograr un objetivo."],["Escenario","Pasos de un caso de uso, con sus variantes."],["Cultura organizacional","Valores y formas de actuar de una organización."]],

  // Recorre los pares y cuenta cada nombre una sola vez
  
}`,tests:[[[],0],[[["Analista","Proyecto"]],2],[[["Analista","Proyecto"],["Proyecto","Máquina"]],3],[[["A","B"],["B","A"]],2],[[["A","B"],["B","C"],["C","A"]],3]]}};

BK[0].ch[2]={t:"Administración de proyectos (1/2): elegir y justificar",pg:"págs. 56–79",res:"Cómo se elige un proyecto, si es viable y si lo que cuesta se compensa con lo que aporta.",
pages:[
{t:"Elegir qué proyectos hacer",h:`<p>Los proyectos de sistemas nacen por muchas razones y no todos deben seguir adelante. Se filtran con criterios. Entre ellos: que cuenten con el respaldo de la administración, que sea el momento oportuno, que ayuden a cumplir los objetivos de la organización y que sean prácticos en cuanto a recursos.</p>`},
{t:"¿Es viable?",h:`<p>Viabilidad es más que “se puede hacer”. Se revisan tres aspectos:</p><ul><li><b>Técnica:</b> ¿el hardware y el software soportan la carga de trabajo?</li><li><b>Económica:</b> ¿el tiempo, el equipo y el costo del estudio valen la pena?</li><li><b>Operacional:</b> ¿las personas van a usar el sistema?</li></ul>`},
{t:"Hardware y software",h:`<p>Para la viabilidad técnica, el analista hace un inventario de lo que ya existe y evalúa lo que haría falta.</p><p>A veces conviene comprar software comercial ya hecho (<b>COTS</b>) y personalizarlo, en vez de desarrollarlo. Para decidir hay que pronosticar si la organización crecerá mucho.</p>`},
{t:"Costos y beneficios",h:`<p>Costos y beneficios se analizan juntos porque están interrelacionados. Hay <b>tangibles</b> (se miden en dinero) e <b>intangibles</b> (difíciles de medir).</p><p>Para compararlos se usan técnicas simples: análisis de punto de equilibrio, retribución, flujo de efectivo y valor presente.</p>`}],
quiz:[
{q:"¿Cuál es un criterio para seleccionar proyectos?",o:["Contar con el respaldo de la administración","Que use la tecnología más nueva","Que sea barato sin importar el resultado","Que lo proponga el analista"],a:0,e:"El respaldo de la administración es uno de los criterios de selección."},
{q:"¿Qué evalúa la viabilidad técnica?",o:["Si el equipo se lleva bien","Si el hardware y software manejan la carga de trabajo","Si el usuario está contento","Si el proyecto es barato"],a:1,e:"Revisa que la tecnología sea capaz de soportar el trabajo."},
{q:"¿Qué es el software COTS?",o:["Software hecho a la medida desde cero","Software comercial ya hecho que se puede personalizar","Un tipo de base de datos","Un diagrama de flujo"],a:1,e:"COTS es software comercial disponible en el mercado."},
{q:"¿Por qué se analizan juntos los costos y los beneficios?",o:["Por costumbre","Porque están interrelacionados","Porque son iguales","No se analizan juntos"],a:1,e:"Cambiar uno suele afectar al otro."},
{q:"¿Cuál es una técnica para comparar costos y beneficios?",o:["Diagrama E-R","Análisis del valor presente","Caso de uso","JAD"],a:1,e:"El valor presente es una de las técnicas, junto con punto de equilibrio y flujo de efectivo."}],
glos:[["Viabilidad técnica","Si la tecnología puede manejar la carga de trabajo."],["Viabilidad económica","Si los recursos y costos justifican el proyecto."],["Viabilidad operacional","Si las personas aceptarán y usarán el sistema."],["COTS","Software comercial ya hecho que se compra y se adapta."],["Beneficio intangible","Ventaja difícil de medir en dinero."],["Punto de equilibrio","Momento en que los beneficios igualan a los costos."],["Retribución","Tiempo que tarda el sistema en recuperar su costo."]],
reto:{t:"¿En cuántos meses se recupera?",d:`Escribe <code class=i>mesesDeRetorno(datos)</code>. Recibe un objeto con <code class=i>costo</code> y <code class=i>ahorro</code> (ahorro mensual) y devuelve en cuántos meses se recupera el costo, redondeando hacia arriba. Con <code class=i>{costo: 1000, ahorro: 300}</code> el resultado es 4. Pista: <code class=i>Math.ceil</code>.`,fn:"mesesDeRetorno",start:`function mesesDeRetorno(datos) {
  // datos.costo y datos.ahorro
  
}`,tests:[[{costo:1000,ahorro:250},4],[{costo:1000,ahorro:300},4],[{costo:500,ahorro:500},1],[{costo:900,ahorro:100},9],[{costo:0,ahorro:50},0]]}};
BK[0].ch[3]={t:"Administración de proyectos (2/2): planear y proponer",pg:"págs. 80–102",res:"Cómo se planean las actividades, qué es la ruta crítica y cómo se arma una propuesta de sistemas.",
pages:[
{t:"Planear las actividades",h:`<p>Un proyecto es un conjunto de actividades, y muchas dependen de otras: una no puede empezar hasta que termine su predecesora. Planear es identificar las actividades, su orden y cuánto dura cada una.</p>`},
{t:"Rutas y ruta crítica",h:`<p>Un diagrama PERT dibuja las actividades como flechas entre nodos. De inicio a fin hay varias rutas. La más larga es la <b>ruta crítica</b>: si se retrasa un solo día, todo el proyecto se retrasa. En las demás rutas hay margen.</p>`},
{t:"Estatutos del proyecto",h:`<p>Antes de empezar se acuerda qué se va a hacer y cuándo. Eso se escribe en los estatutos del proyecto, que fijan objetivos, alcance y responsables. Sirven tanto a consultores externos como a analistas internos.</p>`},
{t:"El equipo",h:`<p>El analista también administra personas. Pide comunicación precisa y un equipo elegido por su competencia y su compatibilidad. Ayudan la motivación y las normas del equipo, acordadas entre todos.</p>`},
{t:"La propuesta de sistemas",h:`<p>Además de los estatutos, el analista prepara una propuesta de sistemas. Reúne lo que encontró y lo que recomienda, y se presenta de forma profesional a quienes deciden si el proyecto avanza.</p>`}],
quiz:[
{q:"¿Qué es la ruta crítica?",o:["La ruta más corta","La ruta más larga: si se retrasa, se retrasa todo el proyecto","La que tiene más actividades","La más barata"],a:1,e:"Un retraso en la ruta crítica atrasa todo el proyecto."},
{q:"Si se retrasa un día una actividad fuera de la ruta crítica, ¿qué pasa?",o:["Siempre se retrasa todo","No necesariamente se retrasa el proyecto","El proyecto se cancela","Se adelanta el proyecto"],a:1,e:"Las rutas no críticas tienen margen."},
{q:"¿Para qué sirven los estatutos del proyecto?",o:["Para elegir el hardware","Para acordar qué se entregará y cuándo","Para dibujar el modelo E-R","Para capacitar usuarios"],a:1,e:"Fijan objetivos, alcance y responsabilidades."},
{q:"Al formar el equipo, ¿qué se busca?",o:["Solo rapidez","Competencia y compatibilidad","Que todos piensen igual","Que sean externos"],a:1,e:"Se eligen personas capaces y que trabajen bien juntas."},
{q:"¿Qué prepara el analista además de los estatutos?",o:["Una propuesta de sistemas","Un cuestionario","Un manual de usuario","Un diccionario de datos"],a:0,e:"La propuesta presenta hallazgos y recomendaciones."}],
glos:[["Actividad","Tarea del proyecto con una duración."],["Predecesora","Actividad que debe terminar antes de otra."],["PERT","Diagrama que muestra actividades, orden y rutas."],["Ruta crítica","Ruta más larga del proyecto; un retraso en ella atrasa todo."],["Estatutos del proyecto","Acuerdo escrito de objetivos, alcance y responsables."],["Propuesta de sistemas","Documento con hallazgos y recomendaciones para decidir."]],
reto:{t:"Ruta crítica",d:`Escribe <code class=i>duracionRutaCritica(rutas)</code>. Recibe una lista de rutas, cada una con las duraciones de sus actividades, como <code class=i>[[2,3],[4,1]]</code>. Devuelve la duración de la ruta más larga (aquí, 5). Si no hay rutas, devuelve 0.`,fn:"duracionRutaCritica",start:`function duracionRutaCritica(rutas) {
  // Suma cada ruta y quédate con la mayor
  
}`,tests:[[[[2,3],[4,1]],5],[[[1,1,1],[2]],3],[[[5]],5],[[[3,4],[2,2,2],[7]],7],[[],0]]}};
BK[0].ch[4]={t:"Recopilación de información: métodos interactivos",pg:"págs. 103–130",res:"Entrevistas, diseño de aplicación conjunta y cuestionarios para descubrir qué necesitan las personas.",
pages:[
{t:"Tres métodos interactivos",h:`<p>Para conocer los requerimientos humanos de información hay tres métodos principales: <b>entrevistas</b>, <b>diseño de aplicación conjunta (JAD)</b> y <b>cuestionarios</b>. Se hacen distinto, pero comparten la meta de escuchar bien.</p>`},
{t:"Antes de entrevistar",h:`<p>Empieza por conocerte: tu educación, tus emociones y tu marco ético son filtros que sesgan lo que percibes.</p><p>Luego se preparan cinco pasos, que van desde investigar los antecedentes de los entrevistados hasta decidir a quién entrevistar.</p>`},
{t:"Tipos de preguntas",h:`<ul><li><b>Abiertas:</b> dejan al entrevistado responder con libertad.</li><li><b>Cerradas:</b> limitan las opciones, por ejemplo “¿cuántas veces por semana…?”.</li><li><b>De sondeo:</b> profundizan. La más fuerte es la más simple: “¿por qué?”.</li></ul>`},
{t:"JAD: entrevistas en grupo",h:`<p>Entrevistar uno a uno consume tiempo y es propenso a errores. En el JAD se reúne al grupo de usuarios. Reduce tiempo y costo, mejora la calidad de los requerimientos y hace que los usuarios sientan el sistema como suyo.</p>`},
{t:"Cuestionarios y efecto halo",h:`<p>Los cuestionarios permiten estudiar posturas, creencias y comportamientos de muchas personas a la vez.</p><p>Cuidado con el <b>efecto halo</b>: la impresión de una pregunta se arrastra a la siguiente. Se reduce con un buen diseño del cuestionario, por ejemplo con escalas más detalladas.</p>`}],
quiz:[
{q:"¿Cuáles son los tres métodos interactivos?",o:["Entrevistas, JAD y cuestionarios","DFD, E-R y casos de uso","PERT, COTS y CASE","Prototipos, pruebas y manuales"],a:0,e:"Son entrevistas, diseño de aplicación conjunta y cuestionarios."},
{q:"¿Cuál es una pregunta cerrada?",o:["¿Qué piensa del sistema nuevo?","¿Cuántas llamadas recibe el centro al mes?","Explíqueme cómo trabaja.","¿Por qué?"],a:1,e:"Pide un dato concreto y limita la respuesta."},
{q:"¿Cuál es la pregunta de sondeo más simple y fuerte?",o:["¿Cuánto cuesta?","¿Quién es su jefe?","¿Por qué?","¿Cuántos son?"],a:2,e:"Invita a dar detalles más allá de la primera respuesta."},
{q:"¿Por qué se usa el JAD?",o:["Para evitar usuarios","Para reducir el tiempo y costo de las entrevistas personales","Para programar más rápido","Para eliminar documentación"],a:1,e:"También mejora los requerimientos y el compromiso del usuario."},
{q:"¿Qué es el efecto halo?",o:["Una impresión de una pregunta que se arrastra a la siguiente","Un error de programación","Un tipo de pregunta abierta","Un diagrama"],a:0,e:"La impresión de una respuesta contamina las siguientes."}],
glos:[["Entrevista","Conversación planeada para obtener información."],["Pregunta abierta","Deja al entrevistado responder con libertad."],["Pregunta cerrada","Limita las opciones de respuesta."],["Sondeo","Pregunta de seguimiento para profundizar."],["JAD","Diseño de aplicación conjunta: trabajo en grupo con los usuarios."],["Cuestionario","Conjunto de preguntas para muchas personas."],["Efecto halo","Impresión de una pregunta que se acarrea a la siguiente."]],
reto:{t:"Clasifica la pregunta",d:`Escribe <code class=i>clasificar(pregunta)</code>. Pasa el texto a minúsculas y devuelve: <code class=i>"sondeo"</code> si contiene <code class=i>"por qué"</code> o <code class=i>"explicarme"</code>; si no, <code class=i>"cerrada"</code> si empieza por <code class=i>"¿cuánt"</code> o <code class=i>"¿cuál"</code>; en cualquier otro caso, <code class=i>"abierta"</code>.`,fn:"clasificar",start:`function clasificar(pregunta) {
  // Usa toLowerCase, includes y startsWith
  
}`,tests:[["¿Por qué?","sondeo"],["¿Podría explicarme eso?","sondeo"],["¿Cuántas llamadas recibe el centro al mes?","cerrada"],["¿Cuál fuente de información es más valiosa?","cerrada"],["¿Qué piensa de poner a todos los gerentes en una intranet?","abierta"],["Por favor explique cómo decide los tiempos.","abierta"]]}};

function stats(){var l=lg(),nx=L.filter(function(x){return x.m>G.xp})[0],pc=nx?Math.round((G.xp-l.m)/(nx.m-l.m)*100):100;return "<div class=stats><div class=st style='border-color:"+l.c+"'>Liga <b>"+l.n+"</b></div><div class=st><b>"+G.xp+"</b> XP</div><div class=st><b>"+G.bank+"</b> monedas</div><div class=st style='flex:1;min-width:12rem'>"+(nx?"Hacia "+nx.n+": faltan "+(nx.m-G.xp)+" XP":"Liga máxima")+"<div class=pb style='margin:.3rem 0 0'><i style='width:"+pc+"%'></i></div></div></div>"}
function rank(){var a=RV.map(function(r){return{n:r[0],x:r[1]}});a.push({n:S.u,x:G.xp,me:1});a.sort(function(p,q){return q.x-p.x});var i=a.findIndex(function(r){return r.me}),nx=a[i-1],h="<h1 class=hd>Ranking</h1>"+stats()+"<div class=card style='margin-bottom:1rem'>"+(nx?"Te faltan <b>"+(nx.x-G.xp+1)+" XP</b> para pasar a "+esc(nx.n)+".":"Vas en primer lugar. Sigue así.")+"</div><div class=card>";a.forEach(function(r,j){h+="<div class='rk"+(r.me?" me":"")+"'><span class=n>"+(j+1)+"</span>"+esc(r.n)+(r.me?" (tú)":"")+"<span class=lgb style='background:"+lg(r.x).c+"'>"+lg(r.x).n+"</span><span class=x>"+r.x+" XP</span></div>"});shell(h+"</div><p class=mu>Los competidores son simulados en esta demo. Un ranking real necesita un servidor.</p>")}
function shop(){var h="<h1 class=hd>Tienda de títulos</h1><div class=card style='margin-bottom:1rem'>Tienes <b>"+G.bank+" monedas</b>. Las monedas se gastan; tu XP y tu liga no bajan.</div><div class=card>";T.forEach(function(t,i){var o=G.own.indexOf(i)>=0;h+="<div class=sh><div><b>"+t[0]+"</b><br><span class=mu>"+(o?"Lo tienes":t[1]+" monedas")+"</span></div>"+(o?"<button class='"+(G.eq===i?"al":"yl")+"' data-a=eq data-i="+i+(G.eq===i?" disabled":"")+">"+(G.eq===i?"Equipado":"Equipar")+"</button>":"<button data-a=buy data-i="+i+(G.bank<t[1]?" disabled title='Te faltan monedas'":"")+">Comprar</button>")+"</div>"});shell(h+"</div>")}
var S={u:null,v:"login",b:"kds",c:0,p:0,q:null,code:"",res:null,rd:{dark:true,size:20},err:""},P={},root=document.getElementById("root");
function load(){try{var j=JSON.parse(localStorage.getItem("cx1")||"{}");S.u=j.u||null;P=j.p||{};if(j.g)G=j.g}catch(e){}if(S.u)S.v="home"}
function save(){try{localStorage.setItem("cx1",JSON.stringify({u:S.u,p:P,g:G}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bk(){return BK.filter(function(b){return b.id===S.b})[0]}
function ch(){return bk().ch[S.c]}
function key(b,c){return b+":"+c}
function pr(b,c){return P[key(b,c)]||{}}
function need(c){return Math.ceil(c.quiz.length*.6)}
function passed(b,i){var c=BK.filter(function(x){return x.id===b})[0].ch[i];if(!c.quiz)return false;return pr(b,i).q>=need(c)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function cover(b){var im=b.img;return "<button class='cv"+(b.soon?" soon":"")+"' style='"+(im?"aspect-ratio:"+b.ar+";background:url("+im+") center/cover":"background:linear-gradient(160deg,"+b.c[0]+","+b.c[1]+")")+"' aria-label='"+esc(b.t)+"' "+(b.soon?"":"data-a=go data-v=book data-b="+b.id)+">"+(im?"":"<small>NIVEL "+b.n+"</small>"+b.t+(b.soon?"<small>Próximamente</small>":""))+"</button>"}
function shell(inner){var n=[["home","Inicio"],["lib","Biblioteca"],["prog","Mi progreso"],["rank","Ranking"],["shop","Tienda"]],cur=["home","lib","prog","rank","shop"].indexOf(S.v)>=0?S.v:"lib";
root.innerHTML="<div class=app><aside><div class=brand>Código <b>Express</b></div>"+n.map(function(x){return "<button class='nv"+(x[0]===cur?" on":"")+"' data-a=go data-v="+x[0]+">"+x[1]+"</button>"}).join("")+"<div class=who><span class=av>"+esc(S.u.charAt(0).toUpperCase())+"</span><span>"+esc(S.u)+"<br><small>"+titleName()+" · "+lg().n+" · "+G.xp+" XP</small></span><button data-a=out>Salir</button></div></aside><main>"+inner+"</main></div>"}
function login(){root.innerHTML="<div class=lg><div class=l><h1>Lee. Responde.<br><b>Programa.</b></h1><p>Capítulos cortos, un quiz para comprobar que entendiste y un reto de código para practicar.</p></div><div class=r><form onsubmit='return false'><h2>Entrar</h2><label for=un>Tu nombre</label><input id=un autocomplete=nickname maxlength=24><label for=cc>Código de clase (opcional)</label><input id=cc maxlength=12><div class=er id=er role=alert>"+esc(S.err)+"</div><p><button type=button class=yl data-a=login style='width:100%'>Entrar</button></p><p class=mu style='font-size:.85rem'>Demo: tu progreso se guarda solo en este navegador.</p></form></div></div>"}
function stepsTiles(b,i){var p=pr(b,i);return "<div class=tiles><div class='tl"+(p.r?" y":"")+"'>Lectura</div><div class='tl"+(p.q>=0&&passed(b,i)?" y":"")+"'>Quiz</div><div class='tl"+(p.c?" y":"")+"'>Reto</div></div>"}
function home(){var b=BK[0],i=0;while(i<b.ch.length-1&&!b.ch[i+1].soon&&pr(b.id,i).c)i++;var p=pr(b.id,i),nx=!p.r?"Lee el capítulo "+(i+1):!passed(b.id,i)?"Responde el quiz del capítulo "+(i+1):!p.c?"Resuelve el reto del capítulo "+(i+1):"Capítulo "+(i+1)+" completo";
shell("<h1 class=hd>Inicio</h1>"+stats()+"<div class=banner>Cómo funciona: lee un capítulo, responde el quiz y resuelve el reto de código. Cada paso te da XP y monedas.</div><div class=g2><div class=card><h3>Libros</h3><span class=mu>Elige uno para empezar</span><div class=covers>"+BK.map(cover).join("")+"</div></div><div><div class='card dk'><h3>Siguiente paso</h3><p>"+nx+"</p><button class=yl data-a=go data-v=book data-b="+b.id+" data-c="+i+">Continuar</button></div><div class=card style='margin-top:1rem'><h3>Mi progreso</h3><span class=mu>Logros en capítulo "+(i+1)+"</span>"+stepsTiles(b.id,i)+"</div></div></div>")}
function lib(){shell("<h1 class=hd>Biblioteca</h1><div class=covers>"+BK.map(cover).join("")+"</div>")}
function prog(){var h="<h1 class=hd>Mi progreso</h1>";BK.filter(function(b){return !b.soon}).forEach(function(b){h+="<h3>"+b.t+"</h3>";b.ch.forEach(function(c,i){if(c.soon)return;h+="<div class=card style='margin-bottom:.8rem'><b>Capítulo "+(i+1)+".</b> "+c.t+stepsTiles(b.id,i)+(pr(b.id,i).q!=null?"<p class=mu>Mejor nota del quiz: "+pr(b.id,i).q+" / "+c.quiz.length+"</p>":"")+"</div>"})});shell(h)}
function book(){var b=bk();shell("<h1 class=hd>Ficha del libro</h1><div class=fi><div><span class=tag>NIVEL "+b.n+"</span><h2>"+b.t+"</h2><p class=mu>Autoría: "+b.au+"</p><div class=th>"+b.tema+"</div><p class=mu style='font-size:.9rem'>Temas: "+b.tags+"</p><p>"+b.d+"</p></div><div>"+cover(Object.assign({},b,{soon:0}))+"<p><button class=yl style='width:100%;margin-top:.8rem' data-a=go data-v=read data-c=0>Empezar</button></p></div></div><div class=bar2>Capítulos</div>"+b.ch.map(function(c,i){if(c.soon)return "<details><summary><b>BLOQUE "+(i+1)+"</b> "+c.t+" <span class=mu>("+c.pg+")</span></summary><p class=mu>Próximamente.</p></details>";var p=pr(b.id,i),pq=passed(b.id,i);return "<details"+(i===S.c?" open":"")+"><summary><b>CAPÍTULO "+(i+1)+"</b> "+c.t+"</summary><p>"+c.res+"</p><div class=acts><button data-a=go data-v=read data-c="+i+">Leer"+(p.r?" ✓":"")+"</button><button data-a=go data-v=quiz data-c="+i+(p.r?"":" disabled title='Termina la lectura primero'")+">Quiz"+(pq?" ✓":"")+"</button><button data-a=go data-v=reto data-c="+i+(pq?"":" disabled title='Aprueba el quiz primero'")+">Reto de código"+(p.c?" ✓":"")+"</button><button data-a=go data-v=glos data-c="+i+">Glosario</button></div></details>"}).join(""))}
function back(){return "<p><button class=al data-a=go data-v=book>← Volver al libro</button></p>"}
function reader(){var c=ch(),pg=c.pages[S.p],last=S.p===c.pages.length-1,r=S.rd;
root.innerHTML="<div class='rd "+(r.dark?"dk":"lt")+"'><div class=rt><button class=al data-a=go data-v=book aria-label=Cerrar>✕</button><span class=tag>NIVEL "+bk().n+"</span><div class=sp><button class=al data-a=rs>Restablecer</button><button class=al data-a=sz data-d=-2 aria-label='Letra más pequeña'>A−</button><button class=al data-a=sz data-d=2 aria-label='Letra más grande'>A+</button><button class=al data-a=th>"+(r.dark?"Claro":"Oscuro")+"</button></div></div><div class=pb style='border-radius:0;margin:0'><i style='width:"+((S.p+1)/c.pages.length*100)+"%'></i></div><div class=rc style='font-size:"+r.size+"px'><p style='text-align:center;margin:0'>Capítulo "+(S.c+1)+" · página "+(S.p+1)+" de "+c.pages.length+"</p><h2>"+pg.t+"</h2>"+pg.h+"<div class=row><button class=al data-a=pv "+(S.p?"":"disabled")+">Anterior</button><button data-a=nx>"+(last?"Terminar lectura":"Siguiente")+"</button></div></div></div>"}
function quiz(){var c=ch(),q=S.q;if(!q)q=S.q={i:0,s:0,k:null,o:shuffle([0,1,2,3].slice(0,4)),end:0};
if(q.end){var ok=q.s>=need(c);shell(back()+"<div class=card><h2>Resultado del quiz</h2><div class=big>"+q.s+" / "+c.quiz.length+"</div><p>"+(ok?"Aprobado. El reto de código ya está disponible.":"Necesitas al menos "+need(c)+" aciertos. Repasa la lectura e inténtalo de nuevo.")+"</p><div class=row><button class=al data-a=go data-v=read data-c="+S.c+">Releer</button>"+(ok?"<button data-a=go data-v=reto>Ir al reto</button>":"<button data-a=rq>Repetir quiz</button>")+"</div></div>");return}
var it=c.quiz[q.i],h="<div class=card><div class=pb><i style='width:"+(q.i/c.quiz.length*100)+"%'></i></div><p class=mu>Pregunta "+(q.i+1)+" de "+c.quiz.length+"</p><h2>"+esc(it.q)+"</h2>";
q.o.slice(0,it.o.length).forEach(function(k){var cl="opt";if(q.k!==null){if(k===it.a)cl+=" ok";else if(k===q.k)cl+=" bad"}h+="<button class='"+cl+"' data-a=pk data-k="+k+(q.k!==null?" disabled":"")+">"+esc(it.o[k])+"</button>"});
if(q.k!==null)h+="<div class=fb>"+(q.k===it.a?"Correcto. ":"Casi. ")+it.e+"</div><div class=row><span></span><button data-a=nq>"+(q.i===c.quiz.length-1?"Ver resultado":"Siguiente pregunta")+"</button></div>";
shell(back()+h+"</div>")}
function reto(){var c=ch(),r=c.reto;if(!S.code)S.code=r.start;shell(back()+"<div class=card><h2>Reto: "+r.t+"</h2><p>"+r.d+"</p><textarea id=ed spellcheck=false aria-label='Editor de código'>"+esc(S.code)+"</textarea><div class=row><button class=al data-a=rc>Reiniciar código</button><button class=yl data-a=run>Probar mi código</button></div><div id=out aria-live=polite></div></div>");if(S.res)showRes()}
function glos(){var c=ch();shell(back()+"<div class=card><h2>Glosario · capítulo "+(S.c+1)+"</h2>"+c.glos.map(function(g){return "<p><b>"+g[0]+".</b> "+g[1]+"</p>"}).join("")+"</div>")}
function run(){var r=ch().reto,fn,err=null;S.res=[];
try{fn=new Function(S.code+"\nreturn typeof "+r.fn+"==='function'?"+r.fn+":null;")();if(!fn)err="No encuentro la función "+r.fn+"."}catch(e){err="Error en tu código: "+e.message}
if(err)S.res={err:err};else r.tests.forEach(function(t){var g,m=null;try{g=fn(JSON.parse(JSON.stringify(t[0])))}catch(e){m=e.message}S.res.push({a:JSON.stringify(t[0]),e:t[1],g:m!==null?"error: "+m:g,ok:m===null&&g===t[1]})});showRes()}
function showRes(){var o=document.getElementById("out"),r=S.res;if(r.err){o.innerHTML="<div class=fb style='background:var(--badb);color:var(--bad)'>"+esc(r.err)+"</div>";return}
var ok=r.every(function(x){return x.ok}),f=ch().reto.fn;
o.innerHTML=r.map(function(x){return "<div class='t "+(x.ok?"ok":"bad")+"'>"+(x.ok?"✓":"✗")+" "+f+"("+esc(x.a)+") → esperado "+x.e+", obtuve "+esc(x.g)+"</div>"}).join("")+(ok?"<div class=row><span></span><button data-a=fin>Terminar capítulo</button></div>":"<div class=fb>Todavía no pasan todas las pruebas. Revisa los casos en rojo.</div>")}
function reset(){S.p=0;S.q=null;S.res=null;S.code=""}
var A={buy:function(d){var t=T[+d.i];if(G.bank>=t[1]&&G.own.indexOf(+d.i)<0){G.bank-=t[1];G.own.push(+d.i);G.eq=+d.i;save();render()}},eq:function(d){G.eq=+d.i;save();render()},
login:function(){var n=document.getElementById("un").value.trim();if(n.length<2){S.err="Escribe tu nombre (mínimo 2 letras).";login();return}S.err="";S.u=n;S.v="home";save();render()},
out:function(){S.u=null;S.v="login";save();render()},
go:function(d){if(d.v)S.v=d.v;if(d.b)S.b=d.b;if(d.c!==undefined)S.c=+d.c;reset();render();window.scrollTo(0,0)},
pv:function(){S.p--;render()},
nx:function(){var c=ch();if(S.p===c.pages.length-1){var k=key(S.b,S.c);if(!(P[k]&&P[k].r))addXp(20);P[k]=Object.assign(P[k]||{},{r:1});save();A.go({v:"book"})}else{S.p++;render();window.scrollTo(0,0)}},
pk:function(d){var c=ch(),q=S.q;q.k=+d.k;if(q.k===c.quiz[q.i].a)q.s++;render()},
nq:function(){var c=ch(),q=S.q;q.k=null;q.o=shuffle([0,1,2,3]);if(q.i===c.quiz.length-1){q.end=1;var k=key(S.b,S.c);var ob=P[k]&&P[k].q||0;if(q.s>ob)addXp(10*(q.s-ob));P[k]=Object.assign(P[k]||{},{q:Math.max(q.s,P[k]&&P[k].q||0)});save()}else q.i++;render()},
rq:function(){S.q=null;render()},
run:run,rc:function(){S.code=ch().reto.start;S.res=null;reto()},
fin:function(){var k=key(S.b,S.c);if(!(P[k]&&P[k].c))addXp(50);P[k]=Object.assign(P[k]||{},{c:1});save();A.go({v:"book"})},
sz:function(d){S.rd.size=Math.max(14,Math.min(34,S.rd.size+(+d.d)));render()},
th:function(){S.rd.dark=!S.rd.dark;render()},
rs:function(){S.rd={dark:true,size:20};render()}};
root.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(t&&!t.disabled&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
root.addEventListener("input",function(e){if(e.target.id==="ed")S.code=e.target.value});
root.addEventListener("keydown",function(e){var t=e.target;if(t.id==="ed"&&e.key==="Tab"){e.preventDefault();var s=t.selectionStart;t.value=t.value.slice(0,s)+"  "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;S.code=t.value}
if((t.id==="un"||t.id==="cc")&&e.key==="Enter")A.login()});
function render(){if(!S.u)S.v="login";({rank:rank,shop:shop,login:login,home:home,lib:lib,prog:prog,book:book,read:reader,quiz:quiz,reto:reto,glos:glos})[S.v]()}
load();render();
</script>
